<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Premier Pro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Premier Pro</h1>
    <button id="importBtn">Importar</button>
    <input id="mediaInput" type="file" accept="video/*,audio/*,image/*" multiple hidden />
    <button id="srtBtn" disabled>Exportar SRT</button>
  </header>

  <main>
    <section id="preview">
      <video id="video" controls playsinline></video>
      <div id="emptyState">
        <h2>Editor de vídeo offline</h2>
        <p>Importe vídeos, áudios ou imagens para começar.</p>
      </div>
    </section>

    <section id="tools">
      <button id="splitBtn" disabled>Dividir</button>
      <button id="deleteBtn" disabled>Excluir</button>
      <button id="textBtn">Texto</button>
      <button id="captionBtn">Legenda</button>
    </section>

    <section id="editor">
      <div id="clipProperties" class="panel">
        <h3>Propriedades</h3>
        <div id="propertiesEmpty">Selecione um clipe na linha do tempo.</div>
        <div id="propertiesForm" hidden>
          <label>Início
            <input id="clipStart" type="number" step="0.1" min="0" />
          </label>
          <label>Fim
            <input id="clipEnd" type="number" step="0.1" min="0" />
          </label>
          <label>Texto / legenda
            <textarea id="clipText" rows="3" placeholder="Escreva o texto deste clipe"></textarea>
          </label>
        </div>
      </div>

      <div id="captions" class="panel">
        <h3>Legendas</h3>
        <div id="captionList"></div>
      </div>
    </section>
  </main>

  <footer>
    <div id="timeline">
      <div id="clips"></div>
      <div id="playhead"></div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
