<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Premier Pro</title>
  <style>
    body { margin:0; height:100dvh; display:grid; place-items:center; background:#0b0b0f; color:#f4f4f6; font-family:system-ui,sans-serif; text-align:center; padding:24px; }
    button { margin-top:16px; min-height:44px; padding:0 18px; border:0; border-radius:10px; background:#7c5cff; color:white; font-weight:600; }
  </style>
</head>
<body>
  <div>
    <h1>Premier Pro</h1>
    <p id="message">A carregar o OpenCut…</p>
    <button id="retry" hidden>Tentar novamente</button>
  </div>
  <script>
    fetch('config.json')
      .then(response => response.json())
      .then(config => {
        const url = config.appUrl;
        if (!url || url.includes('SEU-OPENCUT')) {
          document.getElementById('message').textContent = 'Configure a URL do seu OpenCut em config.json ou no secret OPENCUT_WEB_URL.';
          document.getElementById('retry').hidden = false;
          return;
        }
        location.replace(url);
      })
      .catch(() => {
        document.getElementById('message').textContent = 'Não foi possível carregar a configuração do aplicativo.';
        document.getElementById('retry').hidden = false;
      });
    document.getElementById('retry').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
